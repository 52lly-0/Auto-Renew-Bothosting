name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '0 1 * * *' # 每天UTC 1点 (北京时间9点, 一般都会推迟),自行根据服务到期时间调整
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: 🛠️ 安装并启动 sing-box 代理
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "ℹ️ 未配置 NODE_LINK Secret，将使用 GitHub Actions 本地网络直连。"
            echo "LOCAL_PROXY=" >> $GITHUB_ENV
          else
            echo "📥 获取 sing-box 最新版本..."
            API_RESP=$(curl -sf -H "Authorization: token ${GH_TOKEN}" \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest)
            if [ -z "$API_RESP" ]; then
              echo "❌ GitHub API 请求失败（可能被限流）"
              exit 1
            fi
            SINGBOX_VER=$(echo "$API_RESP" | sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"v\{0,1\}\([^"]*\)".*/\1/p')
            
            TARBALL="sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
            DL_URL="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/${TARBALL}"
            curl -fLo sing-box.tar.gz "$DL_URL"
            tar -xzf sing-box.tar.gz
            cp "sing-box-${SINGBOX_VER}-linux-amd64/sing-box" ./sing-box
            chmod +x ./sing-box

            echo "📝 转换节点链接为 sing-box 配置..."
            python3 convert.py "$NODE_LINK"

            echo "🚀 启动 sing-box..."
            nohup ./sing-box run -c config.json > sing-box.log 2>&1 &
            SINGBOX_PID=$!
            sleep 3

            echo "⏳ 正在预热隧道并验证连通性 (带重试机制)..."
            PROXY_OK=false
            # 循环探测 6 次，每次超时 5 秒，失败则等待 3 秒
            for i in {1..6}; do
              # 【修复】：改回 http://
              if curl -x http://127.0.0.1:8080 -s --max-time 5 https://api.ip.sb/ip; then
                PROXY_OK=true
                break
              fi
              echo "⏳ 隧道握手中，等待 3 秒后重试 ($i/6)..."
              sleep 3
            done

            if [ "$PROXY_OK" = true ]; then
              echo ""
              echo "✅ sing-box 代理全速贯通！(PID: $SINGBOX_PID)"
              # 【修复】：传给 Python 脚本的也是 http://
              echo "LOCAL_PROXY=http://127.0.0.1:8080" >> $GITHUB_ENV
            else
              echo ""
              echo "❌ 代理连通性测试彻底失败，节点可能已离线！"
              # 安全打印日志，防止 cat 命令本身报错
              if [ -f "sing-box.log" ]; then 
                echo "📄 附: sing-box 运行崩溃日志："
                cat sing-box.log 
              else 
                echo "⚠️ 未在当前目录找到 sing-box.log" 
              fi
              # 杀掉僵尸进程并退出报错
              kill $SINGBOX_PID || true
              exit 1
            fi
          fi

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY: ${{ env.LOCAL_PROXY }}
        run: |
          xvfb-run --auto-servernum python3 app.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
